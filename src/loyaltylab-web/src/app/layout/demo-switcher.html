<div class="demo-bar">
  <label>
    Demo identity
    <select [value]="identity().id" (change)="onSelect($event)">
      @for (persona of personas; track persona.id) {
        <option [value]="persona.id">{{ persona.label }}</option>
      }
    </select>
  </label>
  @if (theme(); as current) {
    <span class="brand">{{ current.displayName }}</span>
  }
  <nav aria-label="Primary">
    <a routerLink="/offers">Offers</a>
    <a routerLink="/concierge">Concierge</a>
    <a routerLink="/wallet">Wallet</a>
    <a routerLink="/operator/sagas">Operator</a>
  </nav>
  @if (correlationId(); as corr) {
    <span class="corr" title="Last request correlation id">{{ corr }}</span>
  }
</div>
